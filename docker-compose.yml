services:
    app:
        build: .
        command: npm run dev
        ports:
            # Loopback only: the server listens on all interfaces and has unauthenticated upload routes.
            - '127.0.0.1:3000:3000'
        volumes:
            - .:/app
            # Keeps Linux-native binaries (esbuild) apart from the host checkout.
            - node_modules:/app/node_modules
        tmpfs:
            # Masks the local, untrusted input/ reference copy so tools (vitest, eslint) don't pick it up.
            - /app/input

volumes:
    node_modules:
